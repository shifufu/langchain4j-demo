spring:
  application:
    name: langchain4j-demo

server:
  port: 8080

# OpenAI / Volcengine Configuration
langchain4j:
  openai:
    api-key: ${OPENAI_API_KEY:sk-6a6c5867ac98952b2dab90d2}
    base-url: ${OPENAI_BASE_URL:https://api.infinisynapse.cn/api}
    # 设置为 true 使用自定义火山引擎实现，false 使用标准 OpenAI 实现
    use-custom-volcengine: false
    chat:
      model: ark-code-latest
      temperature: 0.7
    embedding:
      # 使用与 chat 相同的模型
      model: ark-code-latest

# 日志配置
logging:
  level:
    com.example.ai: DEBUG
    dev.langchain4j: DEBUG
